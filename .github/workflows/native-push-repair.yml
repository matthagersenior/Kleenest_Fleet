name: Native Push Repair APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'app.config.ts'
      - 'package.json'
      - '.github/workflows/native-push-repair.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: '1'
      NODE_ENV: production
      KLEENEST_STANDALONE_ANDROID: '1'
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://ssgesjzdvdsqacdtasje.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL' }}
      GOOGLE_SERVICES_FILE: ./google-services.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --no-audit --no-fund
      - name: Materialize Firebase Android config securely
        shell: bash
        env:
          FLEET_JSON: ${{ secrets.FLEET_GOOGLE_SERVICES_JSON_BASE64 }}
          SHARED_JSON: ${{ secrets.KLEENEST_GOOGLE_SERVICES_JSON_BASE64 }}
          EXISTING_OWNER_JSON: ${{ secrets.OWNER_GOOGLE_SERVICES_JSON_BASE64 }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          value="${FLEET_JSON:-}"
          [ -n "$value" ] || value="${SHARED_JSON:-}"
          [ -n "$value" ] || value="${EXISTING_OWNER_JSON:-}"
          if [ -n "$value" ]; then
            printf '%s' "$value" | base64 --decode > google-services.json
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            cat > google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "kleenest-ci-placeholder",
              "storage_bucket": "kleenest-ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {"package_name": "com.kleenest.fleet"}
              },
              "oauth_client": [],
              "api_key": [{"current_key": "AIzaSyCIPlaceholderNotForRuntimeUse000000"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          JSON
            echo 'Using synthetic Firebase config for PR compile verification only.'
          else
            echo 'No Firebase Android file secret is configured for Fleet.' >&2
            exit 1
          fi
          node -e "const f=require('./google-services.json');if(!f.client?.some(c=>c.client_info?.android_client_info?.package_name==='com.kleenest.fleet'))throw new Error('Firebase file does not authorize com.kleenest.fleet')"
      - run: npm run audit
      - run: npm run typecheck
      - name: Verify and prebuild native config
        shell: bash
        run: |
          set -euo pipefail
          npx expo config --type public --json > /tmp/expo.json
          node -e "const c=require('/tmp/expo.json');if(c.android?.package!=='com.kleenest.fleet'||!c.android?.googleServicesFile)process.exit(1)"
          npx expo prebuild --platform android --clean
          test -f android/app/google-services.json
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Stage candidate
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          cp "$APK" Kleenest-Fleet-Push-Repair.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kleenest-Fleet-Push-Repair
          path: Kleenest-Fleet-Push-Repair.apk
          if-no-files-found: error
          retention-days: 7
