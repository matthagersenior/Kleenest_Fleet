name: Validate Fleet Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-web-preview-validation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run audit
      - run: npm run typecheck
      - name: Export Expo web app
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://ssgesjzdvdsqacdtasje.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL' }}
        run: npx expo export --platform web --output-dir dist
      - run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Preserve preview as validation artifact only
        uses: actions/upload-artifact@v4
        with:
          name: Kleenest-Fleet-Web-Preview
          path: dist
          retention-days: 7
