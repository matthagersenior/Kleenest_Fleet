name: Publish Fleet OTA Update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'scripts/**'
      - 'app.config.ts'
      - '.github/workflows/ota-update.yml'

permissions:
  contents: read

concurrency:
  group: fleet-production-ota
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify Fleet OTA credential
        run: test -n "$EXPO_TOKEN" || (echo "EXPO_TOKEN is not configured in Kleenest_Fleet" && exit 1)
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Expo authentication
        run: npx eas-cli@latest whoami --non-interactive
      - name: Verify current Fleet dispatch source
        run: |
          grep -q 'Search radius' app/dispatch.tsx
          grep -q 'National' app/dispatch.tsx
          grep -q 'Assign vehicle' app/dispatch.tsx
          grep -q 'onInteractionChange' src/components/FleetMap.tsx
          grep -q "order('occurred_at'" src/services/signals.ts
          grep -q 'e.occurred_at' app/sync.tsx
      - name: Publish Fleet OTA update
        run: npx eas-cli@latest update --channel fleet-production --message "Fleet ${GITHUB_SHA}" --non-interactive
