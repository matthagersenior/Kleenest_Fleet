name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fleet-android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://ssgesjzdvdsqacdtasje.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run audit
      - run: npm run typecheck
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build installable release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Stage APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Kleenest-Fleet.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kleenest-Fleet-APK
          path: Kleenest-Fleet.apk
          if-no-files-found: error
          retention-days: 30
