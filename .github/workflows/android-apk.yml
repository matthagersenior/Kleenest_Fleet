name: Android Standalone APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fleet-standalone-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://ssgesjzdvdsqacdtasje.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL' }}
      NODE_ENV: production
      CI: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run audit
      - run: npm run typecheck
      - name: Generate clean Android project
        run: npx expo prebuild --platform android --clean --non-interactive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build standalone release APK with embedded JS bundle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Boot-test release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            APK=android/app/build/outputs/apk/release/app-release.apk
            PACKAGE=com.kleenest.fleet
            adb install -r "$APK"
            adb logcat -c
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 12
            PID="$(adb shell pidof "$PACKAGE" | tr -d '\r' || true)"
            if [ -z "$PID" ]; then
              echo 'Fleet APK exited during startup.' >&2
              adb logcat -d -v brief | tail -n 500 >&2
              exit 1
            fi
            adb shell dumpsys activity activities | grep -F "$PACKAGE" >/dev/null
      - name: Stage standalone APK
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk Kleenest-Fleet-Standalone.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kleenest-Fleet-Standalone-APK
          path: Kleenest-Fleet-Standalone.apk
          if-no-files-found: error
          retention-days: 30
