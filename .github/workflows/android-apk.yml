name: Android Standalone APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-standalone-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://ssgesjzdvdsqacdtasje.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL' }}
      KLEENEST_STANDALONE_ANDROID: '1'
      NODE_ENV: production
      CI: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --no-audit --no-fund
      - run: npm run audit
      - run: npm run typecheck
      - name: Precompile Android JS and Expo config gate
        run: |
          rm -rf .preflight
          npx expo config --type public --json > /tmp/fleet-expo-config.json
          node -e "const c=require('/tmp/fleet-expo-config.json');if(c.android?.package!=='com.kleenest.fleet')process.exit(1);if(c.name!=='Kleenest Fleet')process.exit(1)"
          npx expo export --platform android --output-dir .preflight --clear
          test -d .preflight
          test -n "$(find .preflight -type f -print -quit)"
      - name: Generate clean Android native project
        run: npx expo prebuild --platform android --clean
      - name: Verify standalone release dependency graph
        working-directory: android
        run: |
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > /tmp/fleet-release-deps.txt
          grep -Eqi 'react-native-reanimated' /tmp/fleet-release-deps.txt
          grep -Eqi 'react-native-worklets' /tmp/fleet-release-deps.txt
          if grep -Eqi 'expo-dev-client|expo-dev-launcher|expo-dev-menu' /tmp/fleet-release-deps.txt; then
            echo 'Expo development runtime leaked into Fleet release dependencies.' >&2
            exit 1
          fi
      - name: Build standalone release APK with embedded JS bundle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify release artifact and ARM64 runtime payload
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          unzip -p android/app/build/outputs/apk/release/app-release.apk assets/index.android.bundle > /tmp/fleet.bundle
          test -s /tmp/fleet.bundle
          grep -a -q 'ssgesjzdvdsqacdtasje.supabase.co' /tmp/fleet.bundle
          ! grep -a -q 'Development Build' /tmp/fleet.bundle
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'lib/arm64-v8a/libreactnative.so'
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'lib/arm64-v8a/libhermesvm.so'
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'lib/arm64-v8a/libappmodules.so'
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'lib/arm64-v8a/libreanimated.so'
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'lib/arm64-v8a/libworklets.so'
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm
      - name: Android 16 Fleet startup test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            adb wait-for-device
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am force-stop com.kleenest.fleet
            adb shell monkey -p com.kleenest.fleet -c android.intent.category.LAUNCHER 1
            sleep 30
            test -n "$(adb shell pidof com.kleenest.fleet | tr -d '\r' || true)" || (echo 'Fleet APK exited during startup.' >&2; adb logcat -d -v threadtime | tail -n 1200 >&2; exit 1)
            adb shell dumpsys activity activities | grep -F com.kleenest.fleet >/dev/null
            ! adb logcat -d -v threadtime | grep -E 'Process: com\.kleenest\.fleet|FATAL EXCEPTION.*com\.kleenest\.fleet|UnsatisfiedLinkError.*com\.kleenest\.fleet'
      - name: Stage standalone APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Kleenest-Fleet-Standalone.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kleenest-Fleet-Standalone-APK
          path: Kleenest-Fleet-Standalone.apk
          if-no-files-found: error
          retention-days: 30
