name: Android Standalone APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-standalone-apk
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://ssgesjzdvdsqacdtasje.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL' }}
      KLEENEST_STANDALONE_ANDROID: '1'
      NODE_ENV: production
      CI: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --no-audit --no-fund
      - run: npm run audit
      - run: npm run typecheck
      - name: Expo health and production bundle preflight
        run: |
          npx expo-doctor
          rm -rf .preflight
          npx expo config --type public --json > /tmp/fleet-expo-config.json
          node -e "const c=require('/tmp/fleet-expo-config.json');if(c.android?.package!=='com.kleenest.fleet')process.exit(1);if(c.name!=='Kleenest Fleet')process.exit(1)"
          npx expo export --platform android --output-dir .preflight --clear
          test -n "$(find .preflight -type f -print -quit)"
      - name: Generate clean Android native project
        run: npx expo prebuild --platform android --clean
      - name: Pre-package native and manifest diagnostics
        working-directory: android
        run: |
          ./gradlew :app:processReleaseMainManifest :app:compileDebugKotlin --no-daemon
          find app/build/intermediates -path '*release*AndroidManifest.xml' -print -exec grep -n '<uses-permission' {} \; > /tmp/fleet-manifest-permissions.txt || true
          cat /tmp/fleet-manifest-permissions.txt
      - name: Verify standalone release dependency graph
        working-directory: android
        run: |
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > /tmp/fleet-release-deps.txt
          grep -Eqi 'react-native-reanimated' /tmp/fleet-release-deps.txt
          grep -Eqi 'react-native-worklets' /tmp/fleet-release-deps.txt
          if grep -Eqi 'expo-dev-client|expo-dev-launcher|expo-dev-menu' /tmp/fleet-release-deps.txt; then
            echo 'Expo development runtime leaked into Fleet release dependencies.' >&2
            exit 1
          fi
      - name: Build internal release candidate
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify release candidate and ARM64 payload
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          unzip -p android/app/build/outputs/apk/release/app-release.apk assets/index.android.bundle > /tmp/fleet.bundle
          test -s /tmp/fleet.bundle
          grep -a -q 'ssgesjzdvdsqacdtasje.supabase.co' /tmp/fleet.bundle
          ! grep -a -q 'Development Build' /tmp/fleet.bundle
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'lib/arm64-v8a/libreactnative.so'
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'lib/arm64-v8a/libhermesvm.so'
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'lib/arm64-v8a/libappmodules.so'
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'lib/arm64-v8a/libreanimated.so'
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'lib/arm64-v8a/libworklets.so'
      - name: Enable KVM for x86 Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm
      - name: Android 16 x86_64 startup diagnostic gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash scripts/android-startup-smoke.sh android/app/build/outputs/apk/release/app-release.apk com.kleenest.fleet Fleet-x86_64
      - name: Upload x86 startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kleenest-Fleet-x86-Startup-Diagnostics
          path: android-startup-logs
          if-no-files-found: ignore
          retention-days: 7
      - name: Stage internal candidate
        run: cp android/app/build/outputs/apk/release/app-release.apk Kleenest-Fleet-Candidate.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kleenest-Fleet-Internal-Candidate
          path: Kleenest-Fleet-Candidate.apk
          if-no-files-found: error
          retention-days: 1

  arm64-runtime:
    needs: candidate
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Kleenest-Fleet-Internal-Candidate
          path: candidate
      - name: Android 16 ARM64 startup diagnostic gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: arm64-v8a
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash scripts/android-startup-smoke.sh candidate/Kleenest-Fleet-Candidate.apk com.kleenest.fleet Fleet-ARM64
      - name: Upload ARM64 startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kleenest-Fleet-ARM64-Startup-Diagnostics
          path: android-startup-logs
          if-no-files-found: ignore
          retention-days: 7

  promote:
    needs: arm64-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Kleenest-Fleet-Internal-Candidate
          path: candidate
      - run: cp candidate/Kleenest-Fleet-Candidate.apk Kleenest-Fleet-Standalone.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kleenest-Fleet-Standalone-APK
          path: Kleenest-Fleet-Standalone.apk
          if-no-files-found: error
          retention-days: 30
