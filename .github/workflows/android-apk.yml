name: Android Standalone APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fleet-standalone-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://ssgesjzdvdsqacdtasje.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL' }}
      NODE_ENV: production
      CI: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run audit
      - run: npm run typecheck
      - name: Remove unused animation runtimes from standalone graph
        run: |
          rm -rf node_modules/react-native-reanimated node_modules/react-native-worklets
          test ! -d node_modules/react-native-reanimated
          test ! -d node_modules/react-native-worklets
      - name: Generate clean Android project
        run: npx expo prebuild --platform android --clean --non-interactive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify standalone native dependency graph
        working-directory: android
        run: |
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > /tmp/fleet-release-deps.txt
          if grep -Eqi 'react-native-reanimated|react-native-worklets' /tmp/fleet-release-deps.txt; then
            echo 'Unused animation runtime leaked into Fleet release dependencies.' >&2
            grep -Ei 'react-native-reanimated|react-native-worklets' /tmp/fleet-release-deps.txt >&2 || true
            exit 1
          fi
      - name: Build standalone release APK with embedded JS bundle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify physical-device native payload
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'lib/arm64-v8a/libreactnative.so'
          if unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -Eq 'lib/[^/]+/lib(reanimated|worklets)\.so'; then
            echo 'Fleet APK still contains unused Reanimated/Worklets native libraries.' >&2
            exit 1
          fi
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm
      - name: Android 16 x86_64 release startup test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            adb wait-for-device
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am force-stop com.kleenest.fleet
            adb shell monkey -p com.kleenest.fleet -c android.intent.category.LAUNCHER 1
            sleep 30
            test -n "$(adb shell pidof com.kleenest.fleet | tr -d '\r' || true)" || (echo 'Fleet APK exited during x86_64 startup.' >&2; adb logcat -d -v threadtime | tail -n 1200 >&2; exit 1)
            adb shell dumpsys activity activities | grep -F com.kleenest.fleet >/dev/null
            ! adb logcat -d -v threadtime | grep -E 'Process: com\.kleenest\.fleet|FATAL EXCEPTION.*com\.kleenest\.fleet|UnsatisfiedLinkError.*com\.kleenest\.fleet'
      - name: Stage standalone APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Kleenest-Fleet-Standalone.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kleenest-Fleet-Standalone-APK
          path: Kleenest-Fleet-Standalone.apk
          if-no-files-found: error
          retention-days: 30

  arm64-smoke:
    needs: apk
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Kleenest-Fleet-Standalone-APK
      - name: ARM64 Android runtime startup test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: arm64-v8a
          target: default
          profile: pixel_6
          disable-linux-hw-accel: true
          emulator-boot-timeout: 1200
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -accel off
          script: |
            adb wait-for-device
            adb install -r Kleenest-Fleet-Standalone.apk
            adb logcat -c
            adb shell am force-stop com.kleenest.fleet
            adb shell monkey -p com.kleenest.fleet -c android.intent.category.LAUNCHER 1
            sleep 40
            test -n "$(adb shell pidof com.kleenest.fleet | tr -d '\r' || true)" || (echo 'Fleet APK exited during ARM64 startup.' >&2; adb logcat -d -v threadtime | tail -n 1600 >&2; exit 1)
            adb shell dumpsys activity activities | grep -F com.kleenest.fleet >/dev/null
            ! adb logcat -d -v threadtime | grep -E 'Process: com\.kleenest\.fleet|FATAL EXCEPTION.*com\.kleenest\.fleet|UnsatisfiedLinkError.*com\.kleenest\.fleet'
